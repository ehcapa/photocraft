[package]
name = "photocraft-ml"
description = "On-device subject detection for Select Subject: U2-Netp through tract (native only), no workspace dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Inference is native only: the web build stays under its size gate and falls back to the
# classical saliency pipeline in photocraft-algo.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tract-onnx = { workspace = true }
# The ort tier (docs/fork L2.5): off by default; enabling pulls onnxruntime in for the
# heavy matting models. Pure-Rust builds and the wasm gate never see it.
ort = { workspace = true, optional = true }

[dependencies]
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[features]
ort = ["dep:ort"]

[dev-dependencies]
# The rembg parity test reads the reference PNGs (test-only; the library itself has no decoder).
image = { workspace = true, features = ["png"] }

[lints]
workspace = true
